<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RoadYOLO Ground48 分批人工审核台</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; color: #17212b; background: #eef2f5; }
    header, main { max-width: 1440px; margin: auto; padding: 12px 18px; }
    header { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: #fff; border-bottom: 1px solid #ccd5dd; }
    h1 { margin: 0 auto 0 0; font-size: 20px; }
    button, select, input, textarea { font: inherit; }
    button { padding: 6px 10px; cursor: pointer; }
    button.primary { color: #fff; background: #1769aa; border: 1px solid #125588; border-radius: 4px; }
    button.danger { color: #8b1e1e; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    .fatal { max-width: 900px; margin: 30px auto; padding: 18px; color: #861c1c; background: #fff4f4; border: 1px solid #df9999; white-space: pre-wrap; }
    .toolbar, .tabs, .actions, .checks, .nav { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .toolbar { margin-bottom: 10px; }
    .status { margin-left: auto; font-weight: 600; }
    .grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(320px, 1fr); gap: 12px; }
    .card { padding: 12px; background: #fff; border: 1px solid #ccd5dd; border-radius: 6px; }
    .canvas-wrap { overflow: auto; min-height: 360px; max-height: 76vh; background: #20262c; }
    canvas { display: block; touch-action: none; cursor: crosshair; }
    .tabs button.active { color: #fff; background: #334e68; }
    .meta { margin: 8px 0; font-size: 13px; word-break: break-all; }
    .warn { color: #8a4b00; }
    label { display: inline-flex; gap: 5px; align-items: center; }
    .field { display: grid; grid-template-columns: 100px 1fr; gap: 7px; align-items: center; margin: 7px 0; }
    .field input, .field select, .field textarea { width: 100%; min-width: 0; }
    .box-inputs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
    .box-inputs input { width: 100%; }
    textarea { min-height: 62px; resize: vertical; }
    .checks { padding: 7px; border: 1px solid #d9e1e7; }
    .checks label { min-width: 128px; }
    .decision { margin: 6px 0; padding: 6px; background: #f4f7f9; border-left: 4px solid #789; font-size: 13px; }
    .decision button { float: right; padding: 1px 6px; }
    .complete { color: #176b35; font-weight: 700; }
    .incomplete { color: #a23a27; font-weight: 700; }
    .legend span { margin-right: 12px; }
    .gt { color: #00a85a; } .teacher { color: #e48b00; } .draft { color: #16a4d8; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } .canvas-wrap { max-height: 60vh; } }
  </style>
</head>
<body>
<header>
  <h1>RoadYOLO Ground48 分批人工审核台</h1>
  <label>批次 <select id="bucket">
    <option value="1">第 1 批（12 张）</option>
    <option value="2">第 2 批（12 张）</option>
    <option value="3">第 3 批（12 张）</option>
    <option value="4">第 4 批（12 张）</option>
    <option value="all">全部 48 张</option>
  </select></label>
  <label><input id="riskSort" type="checkbox"> 风险从高到低浏览</label>
  <button id="importButton">导入草稿 JSON</button>
  <input id="importFile" type="file" accept="application/json,.json" hidden>
  <button id="exportButton" class="primary">导出 Patch JSON</button>
</header>
<main id="app" hidden>
  <div class="toolbar nav">
    <button id="prev">← 上一张</button><button id="next">下一张 →</button>
    <select id="jump" aria-label="跳转图片"></select>
    <span id="progress"></span><span id="completeCount" class="status"></span>
  </div>
  <div class="grid">
    <section class="card">
      <div class="tabs">
        <button data-view="raw" class="active">RAW 无框原图</button>
        <button data-view="gt">GT 来源框</button>
        <button data-view="ai">GT + Teacher / 疑点</button>
        <label>Teacher 显示 <select id="teacherDisplay"><option value="selected" selected>仅当前选中候选</option><option value="all">全部候选（总览）</option></select></label>
        <label>画布缩放 <select id="zoom"><option value="0.25">25%</option><option value="0.5" selected>50%</option><option value="0.75">75%</option><option value="1">100%</option><option value="1.5">150%</option></select></label>
      </div>
      <div id="sampleMeta" class="meta"></div>
      <div id="teacherStatus" class="meta warn"></div>
      <div class="canvas-wrap"><canvas id="canvas" aria-label="审核图片画布"></canvas></div>
      <div class="meta legend"><span class="gt">■ 来源 GT</span><span class="teacher">■ Teacher 候选</span><span class="draft">■ 人工/已采用草稿框</span></div>

    </section>
    <aside class="card">
      <div class="field"><label for="reviewer">审核人（本图）</label><input id="reviewer" autocomplete="off" placeholder="默认1，可修改"></div>
      <div class="field"><label for="original">来源框</label><select id="original"></select></div>
      <div class="field"><label for="teacher">Teacher 候选</label><select id="teacher"></select></div>
      <div class="field"><span>框 [x1,y1,x2,y2)</span><div class="box-inputs"><input id="x1" type="number" step="any" aria-label="x1"><input id="y1" type="number" step="any" aria-label="y1"><input id="x2" type="number" step="any" aria-label="x2"><input id="y2" type="number" step="any" aria-label="y2"></div></div>
      <div class="field"><label for="className">类别</label><select id="className"><option value="person">person</option><option value="vehicle">vehicle</option><option value="ignore">ignore</option></select></div>
      <div class="field"><label for="reason">原因</label><input id="reason" placeholder="M/N/I/D 必填"></div>
      <label><input id="aiAssisted" type="checkbox"> 参考过 AI 候选</label>
      <p class="meta">在 GT 或疑点视图中拖框；坐标保存为原图半开 XYXY。Teacher 可多选采用为 AI 辅助草稿；必须人工核对后签署。</p>
      <div class="actions">
        <button data-action="A">A 接受来源框</button><button data-action="M">M 修改框/类</button>
        <button data-action="N">N 新增人工框</button><button data-action="I">I 设为 ignore</button>
        <button data-action="D" class="danger">D 删除错框</button>
      </div>
      <p><button id="acceptRemaining">人工确认本图剩余来源框为 A</button></p>
      <h3>本图决策</h3><div id="decisions"></div>
      <p class="meta">点击“签署本图 complete”即确认已查看无框原图，并检查人、车、骑行者、停放车辆、小目标/遮挡和 ignore；不再分别勾选。未核对完请勿签署。</p>
      <div class="field"><label for="notes">备注</label><textarea id="notes"></textarea></div>
      <div class="actions"><button id="sign" class="primary">签署本图 complete</button><button id="unsign">撤销 complete</button><span id="completeState"></span></div>
    </aside>
  </div>
</main>
<div id="fatal" class="fatal" hidden></div>

    const wanted = new Set(selected);
    if ([...wanted].some(id => !sample.teacher.some(item => item.candidate_id === id))) throw new Error("选择包含未知候选。");

      const h = Math.max(0, Math.min(a[3], b[3]) - Math.max(a[1], b[1]));
      const intersection = w * h;
      return intersection / ((a[2]-a[0])*(a[3]-a[1]) + (b[2]-b[0])*(b[3]-b[1]) - intersection);
    }

  showDraftBoxes = !showDraftBoxes;
  $("toggleDraftBoxes").textContent = showDraftBoxes ? "隐藏已添加框" : "显示已添加框";
  $("toggleDraftBoxes").setAttribute("aria-pressed", String(!showDraftBoxes));
  draw();
});
const renderBeforeBatch = render;
render = function () { teacherEditId = null; $("teacherSaveEdit").hidden = true; renderBeforeBatch(); renderTeacherBatch(); };
const decisionsBeforeBatch = renderDecisions;
renderDecisions = function () { decisionsBeforeBatch(); renderTeacherBatch(); draw(); };
["original", "teacher"].forEach(id => $(id).addEventListener("change", () => {
  teacherEditId = null; $("teacherSaveEdit").hidden = true;
}));
$("teacherSelectAll").addEventListener("click", () => {
  sample().teacher.forEach(item => batchSelection().add(item.candidate_id));
  $("teacherDisplay").value = "selected"; setView("ai"); renderTeacherBatch();
});
$("teacherClear").addEventListener("click", () => { batchSelection().clear(); renderTeacherBatch(); draw(); });
$("teacherAdopt").addEventListener("click", () => {
  try {
    const planned = globalThis.TeacherBatchCore.plan(sample(), review(), [...batchSelection()]);
    if (!planned.additions.length) { alert("没有可新增的框：所选候选已采用，或与已有框完全相同。"); return; }
    const warning = planned.overlaps.length ? `\n重叠提示：${planned.overlaps.join(", ")} 与已有同类框 IoU≥0.5，采用后请核对是否重复。` : "";
    if (!confirm(`你已核对所选框的位置和类别，确认采用 ${planned.additions.length} 个教师框？\n跳过 ${planned.skipped.length} 个已采用/完全相同框；不会覆盖已有修改，也不会签署 complete。${warning}`)) return;
    review().actions.push(...planned.additions); markChanged(); renderDecisions(); draw();
  } catch (error) { alert(error.message); }
});
$("teacherSaveEdit").addEventListener("click", () => {
  try {
    const index = review().actions.findIndex(item => item.target_id === teacherEditId);
    if (index < 0) throw new Error("此框已撤销，请重新定位。");
    const label = $("className").value;
    const entry = {...review().actions[index], action:label === "ignore" ? "I" : "N", class:label,
      bbox:readBox(), reason:$("reason").value.trim(), ai_assisted:true};
    const errors = Core.actionErrors(sample(), entry); if (errors.length) throw new Error(errors.join("；"));
    review().actions[index] = entry; markChanged(); renderDecisions();
  } catch (error) { alert(error.message); }
});

  $("teacherStatus").textContent = ""; rebuildOrder(null);
})();
</script>
</body>
</html>
