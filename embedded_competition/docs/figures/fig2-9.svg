<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="330" viewBox="0 0 1800 330"><rect width="100%" height="100%" fill="white"/><rect x="35" y="30" width="510" height="150" rx="14" fill="#EEEEEE" stroke="#000000" stroke-width="3"/><text x="290.0" y="79.8" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="36" fill="#000000">上游观测与目标关联</text><text x="290.0" y="130.2" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="36" fill="#000000">确认轨迹及质量状态</text><rect x="645" y="30" width="510" height="150" rx="14" fill="#EEEEEE" stroke="#000000" stroke-width="3"/><text x="900.0" y="79.8" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="36" fill="#000000">跨越迟滞区</text><text x="900.0" y="130.2" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="36" fill="#000000">满足方向、质量与使能条件</text><polyline points="545,105 645,105" fill="none" stroke="#000000" stroke-width="4"/><polygon points="645,105 626.0,96.0 626.0,114.0" fill="#000000"/><rect x="1255" y="30" width="510" height="150" rx="14" fill="#EEEEEE" stroke="#000000" stroke-width="3"/><text x="1510.0" y="79.8" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="36" fill="#000000">越线状态锁存</text><text x="1510.0" y="130.2" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="36" fill="#000000">同一身份累计一次</text><polyline points="1155,105 1255,105" fill="none" stroke="#000000" stroke-width="4"/><polygon points="1255,105 1236.0,96.0 1236.0,114.0" fill="#000000"/><text x="900" y="265" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="30" fill="#000000">单向计数：待确认目标不累计；暂停期间识别继续，越线不累计。</text></svg>