<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="410" viewBox="0 0 1800 410"><rect width="100%" height="100%" fill="white"/><rect x="35" y="40" width="510" height="180" rx="14" fill="#EEEEEE" stroke="#000000" stroke-width="3"/><text x="290.0" y="106.2" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="34" fill="#000000">行RAM</text><text x="290.0" y="153.8" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="34" fill="#000000">保存历史行与局部邻域</text><rect x="645" y="40" width="510" height="180" rx="14" fill="#EEEEEE" stroke="#000000" stroke-width="3"/><text x="900.0" y="106.2" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="34" fill="#000000">FIFO</text><text x="900.0" y="153.8" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="34" fill="#000000">缓冲短时突发及跨节拍传输</text><rect x="1255" y="40" width="510" height="180" rx="14" fill="#EEEEEE" stroke="#000000" stroke-width="3"/><text x="1510.0" y="106.2" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="34" fill="#000000">DDR帧缓存</text><text x="1510.0" y="153.8" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="34" fill="#000000">协调完整图像写入与读出</text><text x="900" y="310" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="32" fill="#000000">三种存储承担不同职责，不表示像素依次经过三者。</text></svg>