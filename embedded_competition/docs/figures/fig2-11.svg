<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="660" viewBox="0 0 1800 660"><rect width="100%" height="100%" fill="white"/><rect x="35" y="35" width="510" height="170" rx="14" fill="#EEEEEE" stroke="#000000" stroke-width="3"/><text x="290.0" y="97.6" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="32" fill="#000000">请求ID、版本与配置</text><text x="290.0" y="142.4" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="32" fill="#000000">主机提交</text><rect x="645" y="35" width="510" height="170" rx="14" fill="#EEEEEE" stroke="#000000" stroke-width="3"/><text x="900.0" y="97.6" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="32" fill="#000000">板端校验与暂存</text><text x="900.0" y="142.4" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="32" fill="#000000">区分配置和曲线更新</text><rect x="1255" y="35" width="510" height="170" rx="14" fill="#EEEEEE" stroke="#000000" stroke-width="3"/><text x="1510.0" y="97.6" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="32" fill="#000000">等待各自提交条件</text><text x="1510.0" y="142.4" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="32" fill="#000000">帧边界 / 完整上传及空闲</text><rect x="35" y="315" width="510" height="170" rx="14" fill="#EEEEEE" stroke="#000000" stroke-width="3"/><text x="290.0" y="377.6" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="32" fill="#000000">回执及实际参数回读</text><text x="290.0" y="422.4" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="32" fill="#000000">主机核对请求与版本</text><rect x="645" y="315" width="510" height="170" rx="14" fill="#EEEEEE" stroke="#000000" stroke-width="3"/><text x="900.0" y="377.6" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="32" fill="#000000">匹配显示标签</text><text x="900.0" y="422.4" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="32" fill="#000000">检查完整视频帧</text><rect x="1255" y="315" width="510" height="170" rx="14" fill="#EEEEEE" stroke="#000000" stroke-width="3"/><text x="1510.0" y="377.6" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="32" fill="#000000">更新界面并记录结果</text><text x="1510.0" y="422.4" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="32" fill="#000000">超时按已有请求重试与回读</text><polyline points="545,120 645,120" fill="none" stroke="#79A9CA" stroke-width="4" stroke-dasharray="14 10"/><polygon points="645,120 626.0,111.0 626.0,129.0" fill="#79A9CA"/><polyline points="1155,120 1255,120" fill="none" stroke="#79A9CA" stroke-width="4" stroke-dasharray="14 10"/><polygon points="1255,120 1236.0,111.0 1236.0,129.0" fill="#79A9CA"/><polyline points="1765,120 1790,120 1790,260 15,260 15,400 35,400" fill="none" stroke="#79A9CA" stroke-width="4" stroke-dasharray="14 10"/><polygon points="35,400 16.0,391.0 16.0,409.0" fill="#79A9CA"/><polyline points="545,400 645,400" fill="none" stroke="#79A9CA" stroke-width="4" stroke-dasharray="14 10"/><polygon points="645,400 626.0,391.0 626.0,409.0" fill="#79A9CA"/><polyline points="1155,400 1255,400" fill="none" stroke="#79A9CA" stroke-width="4" stroke-dasharray="14 10"/><polygon points="1255,400 1236.0,391.0 1236.0,409.0" fill="#79A9CA"/><text x="900" y="590" dominant-baseline="central" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="31" fill="#000000">淡蓝虚线表示命令、确认及主机检查步骤，不是像素数据流。</text></svg>